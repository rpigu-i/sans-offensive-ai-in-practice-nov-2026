services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0  # keep in sync with JUICE_SHOP_REF in setup.sh
    container_name: juice-shop
    ports:
      - "3000:3000"
    networks:
      - default
      # Also on strix-net so the optional Strix sandbox can reach it (and only it).
      - strix-net
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 3s
      retries: 20
      start_period: 40s

  # OWASP ZAP baseline scan (run as a one-shot job)
  zap-baseline:
    image: zaproxy/zap-stable:latest
    container_name: zap-baseline
    depends_on:
      juice-shop:
        condition: service_healthy
    volumes:
      - ./out/zap:/zap/wrk:rw
    command:
      [
        "zap-baseline.py",
        "-t",
        "http://juice-shop:3000",
        "-r",
        "zap_baseline_report.html"
      ]

  # PostgreSQL database for Temporal
  shannon-postgres:
    image: postgres:13
    container_name: shannon-postgres
    environment:
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_USER=temporal
      - POSTGRES_DB=temporal
    volumes:
      - shannon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shannon (AI Pentester) - Temporal workflow orchestrator
  shannon-temporal:
    image: temporalio/auto-setup:latest
    container_name: shannon-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=shannon-postgres
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - DBNAME=temporal
    depends_on:
      shannon-postgres:
        condition: service_healthy
    volumes:
      - shannon-temporal-data:/etc/temporal
    healthcheck:
      test: ["CMD", "tctl", "--address", "shannon-temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Temporal Web UI
  shannon-temporal-ui:
    image: temporalio/ui:latest
    container_name: shannon-temporal-ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=shannon-temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    depends_on:
      shannon-temporal:
        condition: service_healthy

  # Shannon Worker - The autonomous pentesting agent.
  # One-shot job: the worker needs a target URL and repo path, so it is not
  # started by `docker compose up -d`. Run it with `docker compose run --rm shannon-worker ...`.
  shannon-worker:
    profiles: ["shannon"]
    build:
      context: ./tools/shannon
      dockerfile: Dockerfile
    container_name: shannon-worker
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_CODE_MAX_OUTPUT_TOKENS=64000
      - TEMPORAL_ADDRESS=shannon-temporal:7233
      - SHANNON_MAX_TURNS=50
      # Linux/WSL2 only (set by setup.sh): run as the host user so Shannon can
      # write to the bind-mounted workspace/ and out/ folders.
      - SHANNON_HOST_UID=${SHANNON_HOST_UID:-}
      - SHANNON_HOST_GID=${SHANNON_HOST_GID:-}
    depends_on:
      juice-shop:
        condition: service_healthy
      shannon-temporal:
        condition: service_healthy
    volumes:
      # Shannon 3.x writes audit logs and session data to /app/workspaces
      - ./out/shannon:/app/workspaces:rw
      - ./workspace:/app/repos:rw
      - ./tools/shannon/configs:/app/configs:ro
    shm_size: 2gb
    ipc: host
    command: ["node", "apps/worker/dist/temporal/worker.js", "--task-queue", "shannon"]

  # PentestGPT (interactive). Requires cloning the repo into ./tools/PentestGPT first.
  pentestgpt:
    build:
      context: ./tools/PentestGPT
      dockerfile: Dockerfile
    container_name: pentestgpt
    stdin_open: true
    tty: true
    working_dir: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TERM=xterm-256color
      - PYTHONUNBUFFERED=1
      - PENTESTGPT_AUTH_MODE=${PENTESTGPT_AUTH_MODE:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./workspace:/workspace
      # (Optional) Persist Claude Code config if you use it inside PentestGPT:
      - claude-config:/home/pentester/.claude
      - ccr-config:/home/pentester/.claude-code-router
    depends_on:
      juice-shop:
        condition: service_healthy

  # ARTEX (AI autonomous pentester with a web dashboard + approval gate).
  # Optional 4th tool, gated behind the `artex` profile so `docker compose up -d`
  # does not start it. Launch it on demand with:
  #   docker compose --profile artex up -d artex
  # (that also starts its dedicated Postgres and waits for juice-shop).
  # Upstream: https://github.com/BillReyor/ARTEX  (built from source; no published image)
  artex-postgres:
    profiles: ["artex"]
    image: postgres:16-alpine
    container_name: artex-postgres
    environment:
      - POSTGRES_USER=artex
      - POSTGRES_PASSWORD=artex
      - POSTGRES_DB=artex
    volumes:
      - artex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex"]
      interval: 5s
      timeout: 3s
      retries: 10

  artex:
    profiles: ["artex"]
    # Built from source: upstream publishes no usable image and its own
    # Dockerfile only assembles a pre-built binary. setup.sh clones ARTEX into
    # tools/artex and copies dockerfiles/artex.Dockerfile to workshop.Dockerfile.
    build:
      context: ./tools/artex
      dockerfile: workshop.Dockerfile
    container_name: artex
    environment:
      # Dedicated DB so ARTEX never shares schema with Shannon's Postgres.
      - ARTEX_PG_DSN=postgres://artex:artex@artex-postgres:5432/artex?sslmode=disable
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ARTEX_LLM_PROVIDER=${ARTEX_LLM_PROVIDER:-anthropic}
      - ARTEX_LLM_MODEL=${ARTEX_LLM_MODEL:-}
    ports:
      # Localhost-only: ARTEX's /setup is unauthenticated until a password is
      # set, so don't expose it on the LAN. In a Codespace it's still reachable
      # through the forwarded port URL.
      - "127.0.0.1:8787:8787"  # dashboard UI (localhost only)
      - "127.0.0.1:8788:8788"  # MITM traffic proxy (localhost only)
    volumes:
      - ./out/artex:/app/data          # findings, sessions, reports (persisted on host)
      - ./tools/artex/skills:/app/skills  # optional custom skills (overrides image defaults)
    depends_on:
      artex-postgres:
        condition: service_healthy
      juice-shop:
        condition: service_healthy
    restart: unless-stopped

  # Strix (autonomous multi-agent AI pentester: CLI/TUI + local web dashboard).
  # Optional 5th tool, gated behind the `strix` profile so `docker compose up -d`
  # does not start it. It's a one-shot CLI, so launch scans with:
  #   docker compose --profile strix run --rm strix -n -t http://juice-shop:3000 --scan-mode quick
  # and browse results with:
  #   docker compose --profile strix run --rm --service-ports strix view --host 0.0.0.0 --port 8789 --no-open
  # Upstream: https://github.com/usestrix/strix  (Apache-2.0; pinned PyPI wheel)
  strix:
    profiles: ["strix"]
    build:
      context: ./dockerfiles
      dockerfile: strix.Dockerfile
    container_name: strix
    stdin_open: true
    tty: true
    environment:
      - STRIX_LLM=${STRIX_LLM:-anthropic/claude-sonnet-4-6}
      - LLM_API_KEY=${ANTHROPIC_API_KEY:-}
      - STRIX_REASONING_EFFORT=${STRIX_REASONING_EFFORT:-medium}
      # Pinned sandbox image (the default for strix-agent 1.7.0).
      - STRIX_IMAGE=ghcr.io/usestrix/strix-sandbox:1.3.0
      # Strix starts its sandbox as a sibling container through the Docker
      # socket. Put it on strix-net (Juice Shop + this controller only) instead
      # of publishing ports, so it can reach http://juice-shop:3000 and the
      # controller can reach it.
      - STRIX_DOCKER_SANDBOX_NETWORK=strix-net
      - STRIX_SANDBOX_MEM_LIMIT=${STRIX_SANDBOX_MEM_LIMIT:-4g}
      - STRIX_TELEMETRY=${STRIX_TELEMETRY:-0}
      - STRIX_NO_UPDATE_CHECK=1
    ports:
      # Only published with `run --service-ports` (the dashboard command above).
      # Localhost-only: the tokened dashboard link can steer a live scan.
      - "127.0.0.1:8789:8789"
    volumes:
      # Lets Strix create its sandbox container. This gives the container
      # control of your Docker daemon, which is why Strix is opt-in.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./out/strix:/work/strix_runs   # run records, findings, final report
    networks:
      - strix-net
    depends_on:
      juice-shop:
        condition: service_healthy

networks:
  # Fixed name: Strix attaches its sandbox to this network by name.
  strix-net:
    name: strix-net

volumes:
  claude-config:
  ccr-config:
  shannon-temporal-data:
  shannon-postgres-data:
  artex-pgdata:
